<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>VidLens Video Evidence</title>
  <style>
    :root {
      color-scheme: light dark;
      --safe-top: 0px;
      --safe-right: 0px;
      --safe-bottom: 0px;
      --safe-left: 0px;
      --bg: var(--color-background-primary, #f4f1eb);
      --surface: var(--color-background-secondary, rgba(255, 255, 255, .78));
      --surface-strong: var(--color-background-tertiary, #fffdf9);
      --text: var(--color-text-primary, #17201e);
      --muted: var(--color-text-secondary, #66706c);
      --faint: var(--color-text-tertiary, #8b948f);
      --border: var(--color-border-secondary, rgba(23, 32, 30, .12));
      --accent: #d94b36;
      --accent-soft: rgba(217, 75, 54, .11);
      --teal: #1f6668;
      --teal-soft: rgba(31, 102, 104, .1);
      --shadow: 0 18px 45px rgba(30, 42, 39, .09);
      font-family: var(--font-sans, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    }

    :root[data-theme="dark"] {
      --bg: var(--color-background-primary, #101513);
      --surface: var(--color-background-secondary, rgba(28, 35, 32, .82));
      --surface-strong: var(--color-background-tertiary, #18201d);
      --text: var(--color-text-primary, #f3f5f1);
      --muted: var(--color-text-secondary, #a7b0ab);
      --faint: var(--color-text-tertiary, #7b8580);
      --border: var(--color-border-secondary, rgba(235, 241, 237, .12));
      --accent-soft: rgba(239, 99, 76, .14);
      --teal-soft: rgba(78, 166, 167, .14);
      --shadow: 0 22px 55px rgba(0, 0, 0, .24);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      padding: calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(20px + var(--safe-left));
      background-image:
        radial-gradient(circle at 8% 0%, var(--accent-soft), transparent 30%),
        radial-gradient(circle at 92% 12%, var(--teal-soft), transparent 34%);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .shell { width: min(1120px, 100%); margin: 0 auto; }
    .hero { padding: 8px 2px 22px; }
    .eyebrow {
      display: flex; align-items: center; gap: 9px; margin-bottom: 13px;
      color: var(--teal); font-size: 11px; font-weight: 760; letter-spacing: .13em; text-transform: uppercase;
    }
    .lens-mark { width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 50%; position: relative; }
    .lens-mark::after { content: ""; position: absolute; width: 5px; height: 2px; background: var(--accent); transform: rotate(42deg); right: -5px; bottom: -2px; border-radius: 2px; }
    .hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    h1 { margin: 0; max-width: 800px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(27px, 4.2vw, 48px); line-height: 1.03; letter-spacing: -.035em; font-weight: 600; }
    .summary { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .icon-button { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; }
    .icon-button:hover { border-color: var(--teal); color: var(--teal); }
    .icon-button svg { width: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 19px; }
    .metrics span { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 11px; }
    .metrics b { color: var(--text); font-weight: 700; }

    .toolbar { position: sticky; top: var(--safe-top); z-index: 5; display: flex; gap: 12px; justify-content: space-between; padding: 12px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 16px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(16px); }
    .search-box { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-strong); }
    .search-box svg { width: 16px; fill: none; stroke: var(--muted); stroke-width: 1.8; }
    .search-box input { width: 100%; height: 38px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
    .search-box input::placeholder { color: var(--faint); }
    .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-strong); }
    .segmented button { border: 0; border-radius: 8px; padding: 0 12px; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
    .segmented button.active { background: var(--teal); color: white; box-shadow: 0 3px 9px rgba(31, 102, 104, .22); }

    .results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 19px; background: var(--surface); box-shadow: var(--shadow); }
    .media { position: relative; min-height: 235px; overflow: hidden; background: linear-gradient(145deg, #143c3d, #1d2421 60%, #8d3f32); }
    .media::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.28), transparent 35%, rgba(0,0,0,.4)); }
    .media img { width: 100%; height: 100%; min-height: 235px; max-height: 340px; object-fit: cover; display: block; opacity: 0; transition: opacity .24s ease; }
    .media.image-loaded img { opacity: 1; }
    .frame-placeholder { min-height: 235px; display: grid; place-content: center; gap: 6px; text-align: center; color: white; background-image: linear-gradient(130deg, rgba(255,255,255,.04) 25%, transparent 25%), linear-gradient(310deg, rgba(255,255,255,.035) 25%, transparent 25%); background-size: 38px 38px; }
    .frame-placeholder span { font-family: Georgia, serif; font-size: 24px; }
    .frame-placeholder small { color: rgba(255,255,255,.62); letter-spacing: .06em; text-transform: uppercase; font-size: 9px; }
    .media-top { position: absolute; z-index: 2; top: 13px; left: 13px; right: 13px; display: flex; justify-content: space-between; align-items: center; }
    .rank, .confidence { border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(8, 14, 12, .68); backdrop-filter: blur(8px); color: white; font-size: 11px; font-weight: 700; }
    .rank { padding: 6px 9px; }
    .confidence { padding: 6px 10px; }
    .timestamp { position: absolute; z-index: 2; left: 13px; bottom: 13px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.24); border-radius: 9px; padding: 7px 10px; background: rgba(8, 14, 12, .76); backdrop-filter: blur(8px); color: white; font-size: 12px; font-weight: 720; cursor: pointer; }
    .timestamp:disabled { cursor: default; opacity: .78; }
    .timestamp svg { width: 13px; fill: currentColor; }
    .card-body { padding: 17px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .badge { padding: 4px 7px; border-radius: 6px; background: var(--teal-soft); color: var(--teal); font-size: 9px; font-weight: 760; letter-spacing: .07em; text-transform: uppercase; }
    .badge.neutral { color: var(--muted); background: rgba(128,128,128,.1); }
    h2 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; letter-spacing: -.01em; }
    .description { margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.52; }
    .ocr { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .ocr summary { color: var(--teal); font-size: 11px; font-weight: 700; cursor: pointer; }
    .ocr pre { margin: 9px 0 0; max-height: 115px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: var(--muted); font: 11px/1.5 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); }
    .card-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 15px; }
    .card-actions button { border: 0; background: transparent; padding: 0; cursor: pointer; font-size: 11px; font-weight: 720; }
    .ask { color: var(--accent); }
    .source { color: var(--muted); }
    .source:hover, .ask:hover { text-decoration: underline; text-underline-offset: 3px; }

    .limitations { margin-top: 16px; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--surface); color: var(--muted); font-size: 11px; }
    .limitations summary { color: var(--text); font-weight: 700; cursor: pointer; }
    .limitations ul { margin: 9px 0 0; padding-left: 18px; line-height: 1.5; }
    footer { display: flex; justify-content: center; align-items: center; gap: 9px; padding: 20px 0 2px; color: var(--faint); font-size: 10px; }
    .footer-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
    .empty, .status { grid-column: 1 / -1; min-height: 220px; display: grid; place-content: center; gap: 7px; text-align: center; border: 1px dashed var(--border); border-radius: 18px; color: var(--muted); }
    .empty strong, .status strong { color: var(--text); }
    .status { width: min(1120px, 100%); margin: 0 auto; }
    .spinner { width: 28px; height: 28px; justify-self: center; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      body { padding-left: calc(12px + var(--safe-left)); padding-right: calc(12px + var(--safe-right)); }
      .results { grid-template-columns: 1fr; }
      .toolbar { position: static; flex-direction: column; }
      .segmented { min-height: 39px; }
      .segmented button { flex: 1; }
      .media, .media img, .frame-placeholder { min-height: 210px; }
      .icon-button { display: none; }
    }
  </style>
</head>
<body>
  <div id="loading" class="status"><div class="spinner"></div><strong>Preparing visual evidence</strong><span>Connecting to the MCP Apps host…</span></div>
  <div id="error" class="status" hidden></div>
  <main id="app" class="shell" hidden></main>
  <script>/*__VIDLENS_APP_BUNDLE__*/</script>
</body>
</html>
